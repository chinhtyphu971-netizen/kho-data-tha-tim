<script>
const SALES = ['Cường', 'Bình', 'Hà', 'Minh', 'Lan'];
const NAME_KEY = 'khodata-myname-v1';
const MKT_NAME_KEY = 'khodata-myname-mkt-v1';
const NOTIFY_KEY = 'khodata-notify-v1';
const CHAT_READ_KEY = 'khodata-chatread-v1';
const ROLE_KEY = 'khodata-myrole-v1';
const LOCAL_POOL_CACHE_KEY = 'khodata-pool-cache-v1';

// Mã truy cập cho từng vai trò — đổi trực tiếp ở đây rồi đưa file mới lên là áp dụng luôn.
const ROLE_CODES = {
  marketing: 'MKT2026',
  sale: 'SALE2026',
  admin: '112233',
};

// Cấu hình Firebase (kho dữ liệu dùng chung, đồng bộ thời gian thực).
// Để trống {} nếu chưa thiết lập — xem hướng dẫn ở màn Quản trị.
// Sau khi tạo project Firebase, dán nguyên object config vào đây rồi lưu + đưa file lên lại.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyANbJAD96DyIvykR9BMwiTH0dv0C_f03hY",
  authDomain: "kho-data-tha-tim.firebaseapp.com",
  databaseURL: "https://kho-data-tha-tim-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kho-data-tha-tim",
  storageBucket: "kho-data-tha-tim.firebasestorage.app",
  messagingSenderId: "65324221294",
  appId: "1:65324221294:web:40a30d953aaf4b7a55f77f",
};

const FIREBASE_ENABLED = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL);
let dbRef = null;
let pinsRef = null;
let chatsRef = null;
let profilesRef = null;
if (FIREBASE_ENABLED) {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    dbRef = firebase.database().ref('pool');
    pinsRef = firebase.database().ref('pins');
    chatsRef = firebase.database().ref('chats');
    profilesRef = firebase.database().ref('profiles');
  } catch (e) {
    console.error('Firebase init failed', e);
  }
}

// URL Google Apps Script Web App để tự ghi dữ liệu vào Google Sheet.
// Để trống '' nếu chưa thiết lập — xem hướng dẫn ở màn Quản trị.
const SHEETS_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbz6b1um3dix-kQrvBZWKZ-mpWUfabj628mvDF1M6mGSfuROydKRSfTEE089mZ03Lzh1/exec';

function syncToSheet(item) {
  if (!SHEETS_WEBHOOK_URL) return;
  try {
    fetch(SHEETS_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        id: item.id,
        name: item.name,
        note: item.note || '',
        sentBy: item.sentBy || '',
        claimedBy: item.claimedBy || '',
        createdAt: item.createdAt ? formatDateTime(item.createdAt) : '',
        claimedAt: item.claimedAt ? formatDateTime(item.claimedAt) : '',
        status: item.claimedBy ? 'Đã khóa' : 'Đang chờ',
      }),
    }).catch(() => {});
  } catch (e) {}
}

function pinKey(name) {
  // Firebase keys can't contain . # $ [ ] / — strip those just in case.
  return name.trim().toLowerCase().replace(/[.#$\[\]\/]/g, '');
}

async function checkOrRegisterPin(name, pin) {
  if (!pinsRef) return { ok: true }; // no shared store configured, skip PIN check
  const key = pinKey(name);
  if (!key) return { ok: false, reason: 'Tên không hợp lệ' };
  try {
    const snap = await pinsRef.child(key).once('value');
    const existing = snap.val();
    if (existing === null) {
      // First time this name is used — register this PIN for it.
      await pinsRef.child(key).set(pin);
      return { ok: true, registered: true };
    }
    if (existing === pin) return { ok: true };
    return { ok: false, reason: 'Sai mã PIN cho tên này' };
  } catch (e) {
    return { ok: false, reason: 'Không kiểm tra được PIN, kiểm tra mạng rồi thử lại' };
  }
}

function defaultPool() { return { nextId: 128, items: [] }; }

function normalizePool(pool) {
  if (!pool || typeof pool !== 'object') return defaultPool();
  return {
    nextId: typeof pool.nextId === 'number' ? pool.nextId : defaultPool().nextId,
    items: Array.isArray(pool.items) ? pool.items : [],
  };
}

function safeGet(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
function safeRemove(key) { try { localStorage.removeItem(key); } catch (e) {} }

function loadLocalCache() {
  try {
    const raw = localStorage.getItem(LOCAL_POOL_CACHE_KEY);
    if (raw) return normalizePool(JSON.parse(raw));
  } catch (e) {}
  return defaultPool();
}
function saveLocalCache(pool) {
  try { localStorage.setItem(LOCAL_POOL_CACHE_KEY, JSON.stringify(pool)); } catch (e) {}
}

let remoteWarned = false;

async function loadPool() {
  if (dbRef) {
    try {
      const snap = await dbRef.once('value');
      const val = snap.val();
      const pool = normalizePool(val);
      saveLocalCache(pool);
      remoteWarned = false;
      return pool;
    } catch (e) {
      if (!remoteWarned) {
        showToast('Không kết nối được kho dùng chung — đang dùng dữ liệu tạm trên máy', 'warn');
        remoteWarned = true;
      }
      return loadLocalCache();
    }
  }
  return loadLocalCache();
}

async function savePool(pool) {
  saveLocalCache(pool);
  if (dbRef) {
    try {

function resizeImage(dataUrl, maxDim, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

function resizeAvatarSquare(dataUrl, size) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2;
      const sy = (img.height - side) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      resolve(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.start();
    o.stop(ctx.currentTime + 0.36);
  } catch (e) {}
}

function decodeQrLink(dataUrl) {
  return new Promise((resolve) => {
    if (typeof jsQR === 'undefined') { resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const result = jsQR(imageData.data, canvas.width, canvas.height);
        if (!result || !result.data) { resolve(null); return; }
        const text = result.data.trim();
        if (/^https?:\/\//i.test(text)) { resolve(text); return; }
        const digits = text.replace(/\D/g, '');
        if (digits.length >= 9 && digits.length <= 12) { resolve(`https://zalo.me/${digits}`); return; }
        resolve(null);
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

  };
  reader.readAsDataURL(file);
}

async function claim(id) {
  if (!state.saleName) { showToast('Chọn tên Sale trước khi bấm ❤️', 'warn'); return; }
  const myName = state.saleName;

  if (dbRef) {
    // Dùng transaction thật của Firebase để tránh 2 người cùng bấm gần lúc nhau
    // ghi đè lẫn nhau (race condition) — server sẽ tự chọn đúng đúng người bấm trước.
    try {
      const result = await dbRef.transaction((pool) => {
        if (!pool || !Array.isArray(pool.items)) return pool;
        const idx = pool.items.findIndex(it => it.id === id);
        if (idx === -1) return pool;
        if (pool.items[idx].claimedBy) return; // đã có người khác nhận -> huỷ transaction, không ghi gì cả
        const newItems = pool.items.slice();
        newItems[idx] = { ...newItems[idx], claimedBy: myName, claimedAt: Date.now() };
        return { ...pool, items: newItems };
      });
      const val = result && result.snapshot ? result.snapshot.val() : null;
      const pool = normalizePool(val);
      state.pool = pool;
      lastPoolSerialized = JSON.stringify(pool);
      saveLocalCache(pool);
      renderDynamic();
      const item = pool.items.find(it => it.id === id);
      if (!item) return;
      if (item.claimedBy === myName) {
        syncToSheet(item);
        showToast(`Đã khóa DATA #${String(id).padStart(6,'0')} cho ${myName}`, 'ok');
      } else {
        showToast(`Chậm rồi — ${item.claimedBy} lấy trước`, 'warn');
      }
    } catch (e) {
      showToast('Có lỗi khi nhận data, kiểm tra mạng rồi thử lại', 'warn');
    }
    return;
  }

  // Không có Firebase (chỉ chạy local) — giữ cách cũ, không có tranh chấp nhiều máy.
  const current = await loadPool();
  const idx = current.items.findIndex(it => it.id === id);
  if (idx === -1) return;
  if (current.items[idx].claimedBy) {
    state.pool = current;
    lastPoolSerialized = JSON.stringify(current);
    renderDynamic();
    showToast(`Chậm rồi — ${current.items[idx].claimedBy} lấy trước`, 'warn');
    return;
  }
  current.items[idx] = { ...current.items[idx], claimedBy: myName, claimedAt: Date.now() };
  await savePool(current);
  state.pool = current;
  lastPoolSerialized = JSON.stringify(current);
  renderDynamic();
  syncToSheet(current.items[idx]);
  showToast(`Đã khóa DATA #${String(id).padStart(6,'0')} cho ${myName}`, 'ok');
}

function getUnreadCount(itemId) {
  const msgs = allChatsRaw[itemId] ? Object.values(allChatsRaw[itemId]) : [];
  const lastRead = chatReadMap[itemId] || 0;
  const me = myCurrentName();
  return msgs.filter(m => m.ts > lastRead && m.sender !== me).length;
}

  return state.role === 'sale' ? state.saleName : (state.role === 'marketing' ? state.mktName : '');

function isRelevantChatItem(item) {
  if (state.role === 'sale') return item.claimedBy === state.saleName;
  if (state.role === 'marketing') return item.sentBy === state.mktName;
  return false;
}

let knownMsgKeys = null;
function checkForNewChatMessages(raw) {
  const currentKeys = new Set();
  const fresh = [];
  Object.keys(raw).forEach(itemId => {
    const msgs = raw[itemId] || {};
    Object.keys(msgs).forEach(pushKey => {
      const key = itemId + ':' + pushKey;
      currentKeys.add(key);
      if (knownMsgKeys !== null && !knownMsgKeys.has(key)) {
        const m = msgs[pushKey];
        const me = myCurrentName();
        if (m.sender && m.sender !== me) {
          const item = findItemById(Number(itemId));
          if (item && isRelevantChatItem(item)) fresh.push({ item, message: m });
        }
      }
    });
  });
  if (knownMsgKeys === null) { knownMsgKeys = currentKeys; return; }
  knownMsgKeys = currentKeys;
  if (fresh.length) {
    playBeep();
    const first = fresh[0];
    const body = fresh.length === 1
      ? `${first.message.sender}: ${first.message.text}`
      : `${fresh.length} tin nhắn mới`;
    if (state.notifyEnabled && 'Notification' in window && Notification.permission === 'granted') {
      try {
        const n = new Notification('💬 Tin nhắn mới', { body });
        n.onclick = () => { window.focus(); n.close(); };
      } catch (e) {}
    } else {
      showToast(`💬 ${body}`, 'ok');
    }
    if (state.lockedRole) renderDynamic();
  }
}

function nameColor(str) {
  let hash = 0;
  for (let i = 0; i < (str || '').length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 55%, 42%)`;
}

function getFilteredItems(items) {
  const search = (document.getElementById('filterSearch')?.value || '').trim().toLowerCase();
  const sentBy = document.getElementById('filterSentBy')?.value || '';
  const claimedBy = document.getElementById('filterClaimedBy')?.value || '';
  const status = document.getElementById('filterStatus')?.value || '';
  const from = document.getElementById('filterFrom')?.value || '';
  const to = document.getElementById('filterTo')?.value || '';
  return items.filter(it => {
    if (search && !((it.name || '').toLowerCase().includes(search) || (it.note || '').toLowerCase().includes(search))) return false;
    if (sentBy && it.sentBy !== sentBy) return false;
    if (claimedBy && it.claimedBy !== claimedBy) return false;
    if (status === 'pending' && it.claimedBy) return false;
    if (status === 'claimed' && !it.claimedBy) return false;
    if (from && it.createdAt < new Date(from + 'T00:00:00').getTime()) return false;
    if (to && it.createdAt > new Date(to + 'T23:59:59').getTime()) return false;
    return true;
  });
}

function renderDynamic() {
  const items = state.pool.items;
  const pending = items.filter(i => !i.claimedBy).sort((a,b) => a.createdAt - b.createdAt);
  const claimed = items.filter(i => i.claimedBy).sort((a,b) => b.claimedAt - a.claimedAt);

  if (state.role === 'marketing') {
    const mine = items.filter(it => it.sentBy === state.mktName);
    const minePending = mine.filter(it => !it.claimedBy);
    const pill = document.getElementById('pendingPill');
    if (pill) pill.textContent = `📡 ${minePending.length} đang chờ nhận`;

    const mSearch = (document.getElementById('mktFilterSearch')?.value || '').trim().toLowerCase();
    const mStatus = document.getElementById('mktFilterStatus')?.value || '';
    const mFrom = document.getElementById('mktFilterFrom')?.value || '';
    const mTo = document.getElementById('mktFilterTo')?.value || '';
    const mineFiltered = mine.filter(it => {
      if (mSearch && !((it.name || '').toLowerCase().includes(mSearch) || (it.note || '').toLowerCase().includes(mSearch))) return false;
      if (mStatus === 'pending' && it.claimedBy) return false;
      if (mStatus === 'claimed' && !it.claimedBy) return false;
      if (mFrom && it.createdAt < new Date(mFrom + 'T00:00:00').getTime()) return false;
      if (mTo && it.createdAt > new Date(mTo + 'T23:59:59').getTime()) return false;
      return true;
    });

    const logList = document.getElementById('logList');
    if (logList) {
      logList.innerHTML = mineFiltered.length === 0 ? '<div class="empty small">Không có data khớp bộ lọc.</div>' :
        mineFiltered.slice(0,50).map(it => `
          <div class="log-row">
            <span class="ticket">#${String(it.id).padStart(6,'0')}</span>
            <span class="log-name">${it.name}${it.qrImage ? ' 📷' : ''}</span>
            <span class="status ${it.claimedBy ? 'locked' : 'pending'}">${it.claimedBy ? `🔒 ${it.claimedBy}` : 'Đang chờ'}</span>
            ${it.claimedBy ? (() => {
              const n = getUnreadCount(it.id);
              return `<button class="chat-btn ${n > 0 ? 'has-unread' : ''}" data-chat="${it.id}">💬 Trao đổi${n > 0 ? `<span class="chat-badge">${n}</span>` : ''}</button>`;
            })() : ''}
            <span class="log-time">${formatTime(it.createdAt)}</span>
          </div>
        `).join('');
    }
  } else if (state.role === 'sale') {
    const mineCard = (it, badgeText) => {
      const n = getUnreadCount(it.id);
      return `
        <div class="mine-compact">
          ${it.qrImage
            ? `<img class="card-qr-sm" src="${it.qrImage}" alt="QR khách" data-zoom-item="${it.id}" />`
            : `<div class="card-qr-sm" style="display:flex;align-items:center;justify-content:center;color:#556;font-size:9px;text-align:center;">Chưa có QR</div>`
          }
          <div class="mc-info">
            <div class="mc-name"><span class="mc-name-text">${it.name}</span> <span class="ticket">#${String(it.id).padStart(6,'0')}</span> <button class="copy-btn" data-copy-item="${it.id}" title="Copy">📋</button></div>
            <div class="mc-sub">${it.note ? it.note + ' · ' : ''}Nguồn: ${it.sentBy || 'không rõ'} · ${formatTime(it.claimedAt)}</div>
          </div>
          <div class="mc-right">
            ${it.zaloLink ? `<a class="zalo-btn" href="${it.zaloLink}" target="_blank" rel="noopener">💬 Zalo</a>` : ''}
            <button class="chat-btn ${n > 0 ? 'has-unread' : ''}" data-chat="${it.id}">💬 Trao đổi${n > 0 ? `<span class="chat-badge">${n}</span>` : ''}</button>
          </div>
        </div>
      `;
    };

    const saleBody = document.getElementById('saleBody');
    if (saleBody) {
      saleBody.innerHTML = `
        ${pending.length === 0 ? '<div class="empty">Chưa có data mới. Chờ Marketing gửi vào nhé.</div>' : ''}
        <div class="grid">
          ${pending.map(it => {
            const isNew = Date.now() - it.createdAt < 6000;
            return `
              <div class="card ${isNew ? 'pulse' : ''}">
                <div class="card-top">
                  <span class="ticket">#${String(it.id).padStart(6,'0')}</span>
                  <span class="time">🕐 ${formatTime(it.createdAt)}</span>
                </div>
                <div class="card-body">
                  ${it.qrImage
                    ? `<img class="card-qr" src="${it.qrImage}" alt="QR khách" data-zoom-item="${it.id}" />`
                    : `<div class="card-qr" style="display:flex;align-items:center;justify-content:center;color:#556;font-size:11px;text-align:center;">Chưa có ảnh QR</div>`
                  }
                  <div class="card-info">
                    <div class="card-name">${it.name}</div>
                    ${it.note ? `<div class="card-note">${it.note}</div>` : ''}
                  </div>
                </div>
                <button class="heart-btn" data-claim="${it.id}">❤️ Nhận data</button>
              </div>
            `;
          }).join('')}
        </div>
        ${(() => {
          const mineClaimed = claimed.filter(it => it.claimedBy === state.saleName);
          if (mineClaimed.length === 0) return '';
          return `
            <h3 class="sub-head">Đã khóa (của bạn)</h3>
            <div class="locked-list" style="gap:10px;">
              ${mineClaimed.slice(0,10).map(it => mineCard(it, '✔ Bạn đã nhận data này')).join('')}
            </div>
          `;
        })()}
      `;
    }

    const searchInput = document.getElementById('saleSearchInput');
    const searchResults = document.getElementById('saleSearchResults');
    if (searchResults) {
      const q = (searchInput && searchInput.value.trim().toLowerCase()) || '';
      const sFrom = document.getElementById('saleFilterFrom')?.value || '';
      const sTo = document.getElementById('saleFilterTo')?.value || '';
      if (!q && !sFrom && !sTo) {
        searchResults.innerHTML = '<div class="empty small">Gõ tên khách/SĐT hoặc chọn khoảng ngày để tìm trong toàn bộ data bạn đã từng nhận.</div>';
      } else {
        const mine = items.filter(it => {
          if (it.claimedBy !== state.saleName) return false;
          if (q && !((it.name || '').toLowerCase().includes(q) || (it.note || '').toLowerCase().includes(q))) return false;
          if (sFrom && it.claimedAt < new Date(sFrom + 'T00:00:00').getTime()) return false;
          if (sTo && it.claimedAt > new Date(sTo + 'T23:59:59').getTime()) return false;
          return true;
        }).sort((a, b) => b.claimedAt - a.claimedAt);
        searchResults.innerHTML = mine.length === 0
          ? '<div class="empty small">Không tìm thấy data nào khớp trong lịch sử của bạn.</div>'
          : `<div class="locked-list" style="gap:10px;">${mine.map(it => mineCard(it, '✔ Data bạn đã nhận trước đây')).join('')}</div>`;
      }
    }
  } else if (state.role === 'admin') {
    renderSyncBanner();
    renderPinsSection();
    updateFilterOptions(items);
    const filtered = getFilteredItems(items);
    renderStats(filtered);
    const table = document.getElementById('adminTable');
    if (table) {
      table.innerHTML = `
        <div class="table-head">
          <span>STT</span><span>Ảnh</span><span>Mã data</span><span>Khách</span><span>Nguồn data</span><span>Người gửi</span><span>Trạng thái</span><span>Người nhận</span><span>Giờ gửi</span><span>Giờ nhận</span><span></span>
        </div>
        ${filtered.length === 0 ? '<div class="empty small">Không có dữ liệu khớp bộ lọc.</div>' : ''}
        ${filtered.map((it, idx) => `
          <div class="table-row">
            <span class="muted">${idx + 1}</span>
            ${qrThumb(it, 'table-thumb')}
            <span class="ticket">#${String(it.id).padStart(6,'0')}</span>
            <span>${it.name}</span>
            <span class="muted">${it.note || '—'}</span>
            <span class="muted" style="display:flex;align-items:center;gap:6px;">${it.sentBy ? avatarHtml(it.sentBy, 18) : ''}${it.sentBy || '—'}</span>
            <span class="${it.claimedBy ? 'status locked' : 'status pending'}">${it.claimedBy ? '✔ Đã khóa' : 'Đang chờ'}</span>
            <span style="display:flex;align-items:center;gap:6px;">${it.claimedBy ? avatarHtml(it.claimedBy, 18) : ''}${it.claimedBy || '—'}</span>
            <span class="muted">${formatTime(it.createdAt)}</span>
            <span class="muted">${formatTime(it.claimedAt)}</span>
            <button class="row-delete-btn" data-delete="${it.id}" title="Xoá data này">✕</button>
          </div>
        `).join('')}
      `;
    }
  }
}

// Realtime updates when Firebase is on; polling fallback (same-browser tabs) when it's off.
if (dbRef) {
  dbRef.on('value', (snap) => {
    const val = snap.val();
    const pool = normalizePool(val);
    const serialized = JSON.stringify(pool);
    if (serialized !== lastPoolSerialized) {
      state.pool = pool;
      lastPoolSerialized = serialized;
      saveLocalCache(pool);
      checkForNewItems(pool);
      if (state.lockedRole) renderDynamic();
    }
  }, (err) => {
    if (!remoteWarned) {
      showToast('Mất kết nối kho dùng chung — kiểm tra mạng', 'warn');
      remoteWarned = true;
    }
  });
} else {
  setInterval(async () => {
    const fresh = loadLocalCache();
    const serialized = JSON.stringify(fresh);
    if (serialized !== lastPoolSerialized) {
      state.pool = fresh;
      lastPoolSerialized = serialized;
      checkForNewItems(fresh);
      if (state.lockedRole) renderDynamic();
    }
  }, 2000);
  window.addEventListener('storage', (e) => {
    if (e.key === LOCAL_POOL_CACHE_KEY) {
      state.pool = loadLocalCache();
      lastPoolSerialized = JSON.stringify(state.pool);
      checkForNewItems(state.pool);
      if (state.lockedRole) renderDynamic();
    }
  });
}

document.getElementById('app').addEventListener('click', async (e) => {
  const pickBtn = e.target.closest('[data-pick]');
  if (pickBtn) { state.gatePick = pickBtn.dataset.pick; state.gateError = ''; renderGate(); return; }
  if (e.target.closest('#gateBackBtn')) { state.gatePick = null; state.gateError = ''; renderGate(); return; }
  if (e.target.closest('#gateConfirmBtn')) {
    const input = document.getElementById('gateCodeInput');
    const val = input ? input.value : '';
    if (val === ROLE_CODES[state.gatePick]) {
      unlockRole(state.gatePick);
    } else {
      state.gateError = 'Mã không đúng, thử lại.';
      renderGate();
    }
    return;
  }
  if (e.target.closest('#relockBtn')) { relockDevice(); return; }
  if (e.target.closest('#hardRefreshBtn')) {
    const url = new URL(window.location.href);
    url.searchParams.set('v', Date.now());
    window.location.href = url.toString();
    return;
  }
  if (e.target.closest('#saleSearchToggleBtn')) {
    const wrap = document.getElementById('saleSearchWrap');
    const btn = document.getElementById('saleSearchToggleBtn');
    if (wrap && btn) {
      const isOpen = wrap.style.display !== 'none';
      wrap.style.display = isOpen ? 'none' : 'block';
      btn.textContent = isOpen ? '🔍 Tra lại data đã chốt ▾' : '🔍 Tra lại data đã chốt ▴';
    }
    return;
  }

  const roleTab = e.target.closest('[data-role]');
  if (roleTab) { state.role = roleTab.dataset.role; renderShell(); renderNav(); return; }

  if (e.target.closest('#sendBtn')) { addItem(); return; }
  if (e.target.closest('#clearImgBtn')) {
    state.pendingImage = null;
    state.pendingZaloLink = null;
    renderDropZone();
    return;
  }
  if (e.target.closest('#chooseFileBtn')) {
    document.getElementById('fileInput').click();
    return;
  }
  const avatarPick = e.target.closest('[data-avatar-pick]');
  if (avatarPick) {
    avatarPickContext = avatarPick.dataset.avatarPick;
    document.getElementById('avatarFileInput').click();
    return;
  }
  if (e.target.closest('#dropZone')) {
    e.target.closest('#dropZone').focus();
    return;
  }
  if (e.target.closest('#setupConfirmBtn')) {
    const nameInput = document.getElementById('setupNameInput');
    const pinInput = document.getElementById('setupPinInput');
    const name = nameInput ? nameInput.value.trim() : '';
    const pin = pinInput ? pinInput.value.trim() : '';
    if (!name) { showToast('Nhập tên trước đã', 'warn'); return; }
    if (!pin) { showToast('Đặt mã PIN trước đã (để lần sau dùng lại)', 'warn'); return; }
    const btn = document.getElementById('setupConfirmBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Đang kiểm tra…'; }
    const res = await checkOrRegisterPin(name, pin);
    if (btn) { btn.disabled = false; btn.textContent = '✔ Xác nhận'; }
    if (!res.ok) { showToast(res.reason || 'Không xác nhận được', 'warn'); return; }
    if (res.registered) showToast('Đã đăng ký PIN cho tên này — nhớ để dùng máy khác', 'ok');
    if (state.pendingAvatar && profilesRef) {
      profilesRef.child(pinKey(name)).set(state.pendingAvatar).catch(() => {});
      state.pendingAvatar = null;
    }
    setMyName(name);
    return;
  }
  if (e.target.closest('#changeNameBtn')) {
    forgetMyName();
    return;
  }
  if (e.target.closest('#setupMktConfirmBtn')) {
    const nameInput = document.getElementById('setupMktNameInput');
    const pinInput = document.getElementById('setupMktPinInput');
    const name = nameInput ? nameInput.value.trim() : '';
    const pin = pinInput ? pinInput.value.trim() : '';
    if (!name) { showToast('Nhập tên trước đã', 'warn'); return; }
    if (!pin) { showToast('Đặt mã PIN trước đã (để lần sau dùng lại)', 'warn'); return; }
    const btn = document.getElementById('setupMktConfirmBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Đang kiểm tra…'; }
    const res = await checkOrRegisterPin(name, pin);
    if (btn) { btn.disabled = false; btn.textContent = '✔ Xác nhận'; }
    if (!res.ok) { showToast(res.reason || 'Không xác nhận được', 'warn'); return; }
    if (res.registered) showToast('Đã đăng ký PIN cho tên này — nhớ để dùng máy khác', 'ok');
    if (state.pendingAvatar && profilesRef) {
      profilesRef.child(pinKey(name)).set(state.pendingAvatar).catch(() => {});
      state.pendingAvatar = null;
    }
    setMktName(name);
    return;
  }
  if (e.target.closest('#changeMktNameBtn')) {
    forgetMktName();
    return;
  }
  if (e.target.closest('#notifyToggleBtn')) {
    if (state.notifyEnabled) disableNotifications(); else enableNotifications();
    return;
  }
  const claimBtn = e.target.closest('[data-claim]');
  if (claimBtn) { claim(Number(claimBtn.dataset.claim)); return; }
  const deleteBtn = e.target.closest('[data-delete]');
  if (deleteBtn) {
    const id = Number(deleteBtn.dataset.delete);
    const code = prompt(`Xoá DATA #${String(id).padStart(6,'0')}? Không thể hoàn tác.\nNhập lại mã Quản trị để xác nhận:`);
    if (code === null) return;
    if (code !== ROLE_CODES.admin) {
      showToast('Sai mã Quản trị — huỷ thao tác xoá', 'warn');
      return;
    }
    deleteItem(id);
    return;
  }
  const resetPinBtn = e.target.closest('[data-reset-pin]');
  if (resetPinBtn) { resetPin(resetPinBtn.dataset.resetPin); return; }
  const chatBtn = e.target.closest('[data-chat]');
  if (chatBtn) {
    const item = findItemById(Number(chatBtn.dataset.chat));
    if (item) openChat(item);
    return;
  }
  const zoomImg = e.target.closest('[data-zoom-item]');
  if (zoomImg) {
    const item = findItemById(Number(zoomImg.dataset.zoomItem));
    if (item && item.qrImage) openLightbox(item.qrImage);
    return;
  }
  const copyBtn = e.target.closest('[data-copy-item]');
  if (copyBtn) {
    const item = findItemById(Number(copyBtn.dataset.copyItem));
    if (item) {
      const text = item.name || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Đã copy: ' + text, 'ok')).catch(() => showToast('Copy thất bại', 'warn'));
      } else {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast('Đã copy: ' + text, 'ok'); } catch (e) { showToast('Copy thất bại', 'warn'); }
        document.body.removeChild(ta);
      }
    }
    return;
  }
  if (e.target.id === 'lightboxOverlay') { closeLightbox(); return; }
  if (e.target.closest('#lightboxCloseBtn')) { closeLightbox(); return; }
  if (e.target.id === 'chatOverlay') { closeChat(); return; }
  if (e.target.closest('#chatCloseBtn')) { closeChat(); return; }
  if (e.target.closest('#chatSendBtn')) { sendChatMessage(); return; }
  if (e.target.closest('#resetBtn')) {
    const code = prompt('Đây là hành động xoá TOÀN BỘ dữ liệu, không thể hoàn tác.\nNhập lại mã Quản trị để xác nhận:');
    if (code === null) return;
    if (code !== ROLE_CODES.admin) {
      showToast('Sai mã Quản trị — huỷ thao tác xoá', 'warn');
      return;
    }
    resetAll();
    return;
  }
  if (e.target.closest('#filterClearBtn')) { clearAdminFilters(); return; }
  if (e.target.closest('#mktFilterClearBtn')) {
    ['mktFilterSearch', 'mktFilterFrom', 'mktFilterTo'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    const s = document.getElementById('mktFilterStatus'); if (s) s.value = '';
    renderDynamic();
    return;
  }
  if (e.target.closest('#saleFilterClearBtn')) {
    ['saleSearchInput', 'saleFilterFrom', 'saleFilterTo'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    renderDynamic();
    return;
  }
});

document.getElementById('app').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'gateCodeInput') document.getElementById('gateConfirmBtn').click();
  if (e.target.id === 'setupNameInput' || e.target.id === 'setupPinInput') document.getElementById('setupConfirmBtn').click();
  if (e.target.id === 'setupMktNameInput' || e.target.id === 'setupMktPinInput') document.getElementById('setupMktConfirmBtn').click();
  if (e.target.id === 'chatInput') { e.preventDefault(); document.getElementById('chatSendBtn').click(); }
});

document.getElementById('app').addEventListener('input', (e) => {
  if (e.target.id === 'saleSearchInput') renderDynamic();
  if (e.target.id === 'filterSearch') renderDynamic();
  if (e.target.id === 'mktFilterSearch') renderDynamic();
  if (e.target.id === 'pinsSearchInput') renderDynamic();
});

document.getElementById('app').addEventListener('change', (e) => {
  const ids = [
    'filterSentBy', 'filterClaimedBy', 'filterStatus', 'filterFrom', 'filterTo',
    'mktFilterStatus', 'mktFilterFrom', 'mktFilterTo',
    'saleFilterFrom', 'saleFilterTo',
  ];
  if (ids.includes(e.target.id)) renderDynamic();
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) handleImageFile(e.target.files[0]);
  e.target.value = '';
});

document.getElementById('avatarFileInput').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) handleAvatarFile(e.target.files[0]);
  e.target.value = '';
});

document.addEventListener('paste', (e) => {
  if (state.role !== 'marketing') return;
  const items = (e.clipboardData || window.clipboardData).items;
  for (const it of items) {
    if (it.type.indexOf('image') !== -1) {
      handleImageFile(it.getAsFile());
      break;
    }
  }
});

renderApp();
if (!dbRef) {
  loadPool().then(p => {
    state.pool = p;
    lastPoolSerialized = JSON.stringify(p);
    if (state.lockedRole) renderDynamic();
  });
}

(function generateAppIcon() {
  try {
    const size = 180;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const r = 34;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.arcTo(size, 0, size, size, r);
    ctx.arcTo(size, size, 0, size, r);
    ctx.arcTo(0, size, 0, 0, r);
    ctx.arcTo(0, 0, size, 0, r);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#FF6B81');
    grad.addColorStop(1, '#B0203A');
    ctx.fillStyle = grad;
    ctx.fill();

    const cx = size / 2;
    const cy = size * 0.53;
    const w = size * 0.62;
    const topY = cy - w * 0.32;
    ctx.beginPath();
    ctx.moveTo(cx, topY + w * 0.3);
    ctx.bezierCurveTo(cx, topY, cx - w / 2, topY, cx - w / 2, topY + w * 0.3);
    ctx.bezierCurveTo(cx - w / 2, topY + (w + w * 0.3) / 2, cx, topY + (w + w * 0.3) / 2, cx, topY + w);
    ctx.bezierCurveTo(cx, topY + (w + w * 0.3) / 2, cx + w / 2, topY + (w + w * 0.3) / 2, cx + w / 2, topY + w * 0.3);
    ctx.bezierCurveTo(cx + w / 2, topY, cx, topY, cx, topY + w * 0.3);
    ctx.closePath();
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();

    const dataUrl = canvas.toDataURL('image/png');
    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = dataUrl;
    document.head.appendChild(appleIcon);
    const favicon = document.createElement('link');
    favicon.rel = 'icon';
    favicon.href = dataUrl;
    document.head.appendChild(favicon);
  } catch (e) {}
})();
</script>
